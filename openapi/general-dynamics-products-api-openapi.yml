openapi: 3.1.0
info:
  title: General Dynamics Mission Systems Products API
  description: General Dynamics Mission Systems provides technology products and services for aerospace and defense applications, supporting mission-critical systems and government IT solutions.
  version: 1.0.0
  contact:
    name: General Dynamics
    url: https://www.gd.com/
servers:
- url: https://api.gdmissionsystems.com
  description: Production
tags:
- name: Products
  description: Technology products operations
paths:
  /products:
    get:
      operationId: getProducts
      summary: Get Products
      description: Retrieve technology products catalog.
      tags:
      - Products
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
components:
  schemas:
    ProductList:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
